name: Publish 0.1.0-alpha.20 exact release

on:
  push:
    branches:
      - release/publish-0.1.0-alpha.20

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_COMMIT: 076ebe648ba75a5e2744a4a3c105bbae7943b12b
      SOURCE_RUN_ID: "33387341748"
      TAG: v0.1.0-alpha.20
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_COMMIT }}
          fetch-depth: 0

      - name: Verify exact post-merge authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > /tmp/source-run.json
          python - <<'PY'
          import json, os
          value=json.load(open('/tmp/source-run.json', encoding='utf-8'))
          expected=os.environ['TARGET_COMMIT']
          checks={
              'head_sha': value.get('head_sha') == expected,
              'head_branch': value.get('head_branch') == 'main',
              'event': value.get('event') == 'push',
              'status': value.get('status') == 'completed',
              'conclusion': value.get('conclusion') == 'success',
          }
          if not all(checks.values()):
              raise SystemExit(f'post-merge CI authority rejected: {checks}')
          print('post-merge CI authority verified', checks)
          PY
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists: $TAG" >&2
            exit 1
          fi

      - name: Download exact post-merge evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-evidence
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name habitat-verification-ubuntu-latest-py3.14 --dir .release-evidence
          test -f .release-evidence/truth-core.json
          test -f .release-evidence/dist-first/nolane_habitat-0.1.0a20-py3-none-any.whl
          test -f .release-evidence/dist-first/nolane_habitat-0.1.0a20.tar.gz

      - name: Reverify evidence and build admission verdict
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          commit=os.environ['TARGET_COMMIT']
          evidence=Path('.release-evidence')
          required={
              'truth-core':'truth-core.json',
              'matrix':'matrix.json',
              'faults':'faults.json',
              'artifacts':'artifacts.json',
              'scanner':'semgrep-workflows.json',
              'db-recovery':'db-recovery.json',
              'mutation-recovery':'mutation-recovery.json',
              'reproducible-build':'reproducible-build.json',
              'protocol-conformance':'protocol-conformance.json',
              'contract':'contract.json',
          }
          def canon(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          for name, rel in required.items():
              value=json.loads((evidence/rel).read_text(encoding='utf-8'))
              unsigned={k:v for k,v in value.items() if k != 'report_sha256'}
              if value.get('status') != 'passed' or value.get('source_commit') != commit or value.get('report_sha256') != canon(unsigned):
                  raise SystemExit(f'invalid release evidence: {name}')
          auth={
              'schema':1,
              'evidence_type':'review',
              'source_commit':commit,
              'status':'passed',
              'authorization_type':'maintainer-authorization',
              'authorizing_actor':'Nolane-x',
              'release_channel':'alpha-candidate',
              'release_version':'0.1.0-alpha.20',
              'authorization_scope':'publish this exact candidate commit only',
              'basis':'Repository owner explicitly authorized continuing, merging, and completing the alpha pre-release publication in the active engineering session.',
              'claim_boundary':'Owner/maintainer publication authorization only; not an independent GitHub review and not technical evidence.',
          }
          auth['report_sha256']=canon(auth)
          Path('.release/maintainer-authorization.json').write_text(json.dumps(auth, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY
          python tools/build_release_manifest.py \
            --version 0.1.0-alpha.20 --commit "$TARGET_COMMIT" --target alpha-candidate \
            --report truth-core=.release-evidence/truth-core.json \
            --report matrix=.release-evidence/matrix.json \
            --report faults=.release-evidence/faults.json \
            --report artifacts=.release-evidence/artifacts.json \
            --report scanner=.release-evidence/semgrep-workflows.json \
            --report db-recovery=.release-evidence/db-recovery.json \
            --report mutation-recovery=.release-evidence/mutation-recovery.json \
            --report reproducible-build=.release-evidence/reproducible-build.json \
            --report protocol-conformance=.release-evidence/protocol-conformance.json \
            --report contract=.release-evidence/contract.json \
            --artifact wheel=.release-evidence/dist-first/nolane_habitat-0.1.0a20-py3-none-any.whl \
            --artifact sdist=.release-evidence/dist-first/nolane_habitat-0.1.0a20.tar.gz \
            --review maintainer-authorization=.release/maintainer-authorization.json \
            --out .release/release-manifest.json
          python tools/promote_release.py --manifest .release/release-manifest.json --target alpha-candidate --dry-run --out .release/promotion-verdict.json
          python - <<'PY'
          import json
          value=json.load(open('.release/promotion-verdict.json', encoding='utf-8'))
          verdict=value.get('verdict', {})
          if not verdict.get('admitted') or verdict.get('failed_gates') or verdict.get('missing_reports'):
              raise SystemExit(f'release admission blocked: {verdict}')
          print('release admission admitted', value.get('manifest_sha256'))
          PY

      - name: Publish exact prerelease and evidence assets
        shell: bash
        run: |
          set -euo pipefail
          cat > .release/release-notes.md <<'EOF'
          ## Nolane Habitat 0.1.0-alpha.20

          Foundation Convergence closure release: Semantic/Truth authority hardening, active exact-commit certification, Learning and Execution closure, Observatory projection boundaries, governed resource accounting, portable scale-memory evidence, and release-identity hardening.

          Publication is bound to exact commit `076ebe648ba75a5e2744a4a3c105bbae7943b12b` and an admitted alpha-candidate manifest built from post-merge CI evidence.

          Claim boundary: scale evidence remains descriptive/non-gating and environment-scoped. This release does not claim AGI, universal correctness, universal semantic precision, universal hostile-code isolation, independently verified provider billing truth, cross-environment reproducibility, or production performance/SLO superiority without controlled external evidence.
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_COMMIT" \
            --title "Nolane Habitat v0.1.0-alpha.20" \
            --notes-file .release/release-notes.md \
            --prerelease \
            .release-evidence/dist-first/nolane_habitat-0.1.0a20-py3-none-any.whl \
            .release-evidence/dist-first/nolane_habitat-0.1.0a20.tar.gz \
            .release/release-manifest.json \
            .release/promotion-verdict.json \
            .release/maintainer-authorization.json \
            .release-evidence/artifacts.json \
            .release-evidence/protocol-conformance.json \
            .release-evidence/reproducible-build.json \
            .release-evidence/truth-core.json \
            .release-evidence/matrix.json \
            .release-evidence/faults.json \
            .release-evidence/semgrep-workflows.json \
            .release-evidence/db-recovery.json \
            .release-evidence/mutation-recovery.json \
            .release-evidence/contract.json

      - name: Verify published tag and release surface
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$TARGET_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > .release/published-release.json
          python - <<'PY'
          import json, os
          value=json.load(open('.release/published-release.json', encoding='utf-8'))
          required={
              'nolane_habitat-0.1.0a20-py3-none-any.whl','nolane_habitat-0.1.0a20.tar.gz',
              'release-manifest.json','promotion-verdict.json','maintainer-authorization.json',
              'artifacts.json','protocol-conformance.json','reproducible-build.json','truth-core.json',
              'matrix.json','faults.json','semgrep-workflows.json','db-recovery.json','mutation-recovery.json','contract.json',
          }
          assets={x.get('name') for x in value.get('assets', [])}
          if value.get('tag_name') != os.environ['TAG'] or not value.get('prerelease') or not required.issubset(assets):
              raise SystemExit(f'published release verification failed: tag={value.get("tag_name")} prerelease={value.get("prerelease")} missing={sorted(required-assets)}')
          print(value.get('html_url'))
          PY
