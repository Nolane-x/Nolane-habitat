name: Finalize full 0.1.0-alpha.20 release

on:
  push:
    branches:
      - release/publish-0.1.0-alpha.20

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_COMMIT: 076ebe648ba75a5e2744a4a3c105bbae7943b12b
      CI_RUN_ID: "33387341748"
      CODEQL_RUN_ID: "33387341741"
      CI_ARTIFACT_ID: "9756274726"
      TAG: v0.1.0-alpha.20
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_COMMIT }}
          fetch-depth: 0

      - name: Verify complete release authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > /tmp/main.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /tmp/tag.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /tmp/release.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > /tmp/ci.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100" > /tmp/ci-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CODEQL_RUN_ID" > /tmp/codeql.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CODEQL_RUN_ID/jobs?per_page=100" > /tmp/codeql-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CI_ARTIFACT_ID" > /tmp/artifact.json
          python - <<'PY'
          import json, os
          target=os.environ['TARGET_COMMIT']
          main=json.load(open('/tmp/main.json', encoding='utf-8'))
          tag=json.load(open('/tmp/tag.json', encoding='utf-8'))
          rel=json.load(open('/tmp/release.json', encoding='utf-8'))
          ci=json.load(open('/tmp/ci.json', encoding='utf-8'))
          cij=json.load(open('/tmp/ci-jobs.json', encoding='utf-8'))
          cq=json.load(open('/tmp/codeql.json', encoding='utf-8'))
          cqj=json.load(open('/tmp/codeql-jobs.json', encoding='utf-8'))
          art=json.load(open('/tmp/artifact.json', encoding='utf-8'))
          ci_jobs=cij.get('jobs', [])
          cq_jobs=cqj.get('jobs', [])
          expected_ci={
            'windows-latest / Python 3.14',
            'windows-latest / Python 3.10',
            'ubuntu-latest / Python 3.14',
            'ubuntu-latest / Python 3.10',
          }
          expected_cq={'CodeQL / python','CodeQL / javascript-typescript'}
          existing={x.get('name') for x in rel.get('assets', [])}
          forbidden={
            'nolane-habitat-0.1.0-alpha.20-verification-bundle.zip',
            'release-closure-summary.json',
            'SHA256SUMS.txt',
          }
          checks={
            'main': main.get('commit',{}).get('sha') == target,
            'tag': tag.get('object',{}).get('sha') == target,
            'release_target': rel.get('target_commitish') == target,
            'release_prerelease': rel.get('prerelease') is True and rel.get('draft') is False,
            'ci': ci.get('head_sha') == target and ci.get('head_branch') == 'main' and ci.get('event') == 'push' and ci.get('status') == 'completed' and ci.get('conclusion') == 'success',
            'ci_jobs': {x.get('name') for x in ci_jobs} == expected_ci and all(x.get('status') == 'completed' and x.get('conclusion') == 'success' for x in ci_jobs),
            'codeql': cq.get('head_sha') == target and cq.get('head_branch') == 'main' and cq.get('event') == 'push' and cq.get('status') == 'completed' and cq.get('conclusion') == 'success',
            'codeql_jobs': {x.get('name') for x in cq_jobs} == expected_cq and all(x.get('status') == 'completed' and x.get('conclusion') == 'success' for x in cq_jobs),
            'artifact': art.get('name') == 'habitat-verification-ubuntu-latest-py3.14' and art.get('workflow_run',{}).get('head_sha') == target and art.get('expired') is False,
            'no_duplicate_full_assets': not (forbidden & existing),
          }
          if not all(checks.values()):
            raise SystemExit(f'full release authority rejected: {checks}')
          print('full release authority verified', checks)
          PY

      - name: Download complete post-merge verification evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full-verification current-assets output
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name habitat-verification-ubuntu-latest-py3.14 --dir full-verification
          test -f full-verification/foundation-convergence-closure.json
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir current-assets
          python - <<'PY'
          import json
          from pathlib import Path
          closure=json.loads(Path('full-verification/foundation-convergence-closure.json').read_text(encoding='utf-8'))
          verdict=json.loads(Path('current-assets/promotion-verdict.json').read_text(encoding='utf-8'))
          if closure.get('status') != 'passed' or closure.get('criteria_verified') != 12 or closure.get('criteria_total') != 12 or closure.get('failed_criterion_ids') != []:
              raise SystemExit('Foundation Convergence closure is not 12/12 passed')
          v=verdict.get('verdict', {})
          if not v.get('admitted') or v.get('failed_gates') or v.get('missing_reports'):
              raise SystemExit('release admission verdict is not admitted')
          print('closure and admission verified')
          PY

      - name: Build self-contained verification bundle and closure summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          bundle_root=Path('bundle-root')
          bundle_root.mkdir()
          shutil.copytree('full-verification', bundle_root/'verification')
          for name in ('release-manifest.json','promotion-verdict.json','maintainer-authorization.json','foundation-convergence-closure.json'):
              src=Path('current-assets')/name
              if src.exists():
                  shutil.copy2(src, bundle_root/name)
          for src_name, dst_name in (('/tmp/ci.json','post-merge-habitat-ci.json'),('/tmp/ci-jobs.json','post-merge-habitat-ci-jobs.json'),('/tmp/codeql.json','post-merge-codeql.json'),('/tmp/codeql-jobs.json','post-merge-codeql-jobs.json'),('/tmp/artifact.json','verification-artifact-metadata.json')):
              shutil.copy2(src_name, bundle_root/dst_name)
          PY
          (cd bundle-root && zip -qr ../output/nolane-habitat-0.1.0-alpha.20-verification-bundle.zip .)
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def sha(path):
              h=hashlib.sha256();
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''): h.update(chunk)
              return h.hexdigest()
          target=os.environ['TARGET_COMMIT']
          ci=json.load(open('/tmp/ci.json', encoding='utf-8'))
          cij=json.load(open('/tmp/ci-jobs.json', encoding='utf-8'))
          cq=json.load(open('/tmp/codeql.json', encoding='utf-8'))
          cqj=json.load(open('/tmp/codeql-jobs.json', encoding='utf-8'))
          art=json.load(open('/tmp/artifact.json', encoding='utf-8'))
          closure=json.load(open('full-verification/foundation-convergence-closure.json', encoding='utf-8'))
          verdict=json.load(open('current-assets/promotion-verdict.json', encoding='utf-8'))
          manifest=json.load(open('current-assets/release-manifest.json', encoding='utf-8'))
          rel=json.load(open('/tmp/release.json', encoding='utf-8'))
          bundle='output/nolane-habitat-0.1.0-alpha.20-verification-bundle.zip'
          summary={
            'schema':1,
            'release':'0.1.0-alpha.20',
            'tag':os.environ['TAG'],
            'status':'complete',
            'target_commit':target,
            'target_tree':'776c014d3f832c063515aa6add9cd7da4da499de',
            'habitat_ci':{
              'run_id':ci.get('id'),'run_number':ci.get('run_number'),'event':ci.get('event'),'conclusion':ci.get('conclusion'),
              'jobs':sorted([{'name':x.get('name'),'conclusion':x.get('conclusion')} for x in cij.get('jobs',[])], key=lambda x:x['name']),
            },
            'codeql':{
              'run_id':cq.get('id'),'run_number':cq.get('run_number'),'event':cq.get('event'),'conclusion':cq.get('conclusion'),
              'jobs':sorted([{'name':x.get('name'),'conclusion':x.get('conclusion')} for x in cqj.get('jobs',[])], key=lambda x:x['name']),
            },
            'foundation_convergence':{
              'status':closure.get('status'),'criteria_total':closure.get('criteria_total'),'criteria_verified':closure.get('criteria_verified'),
              'failed_criterion_ids':closure.get('failed_criterion_ids'),'report_sha256':closure.get('report_sha256'),
            },
            'release_admission':{
              'admitted':verdict.get('verdict',{}).get('admitted'),
              'failed_gates':verdict.get('verdict',{}).get('failed_gates'),
              'missing_reports':verdict.get('verdict',{}).get('missing_reports'),
              'manifest_sha256':verdict.get('manifest_sha256'),
            },
            'verification_artifact':{
              'id':art.get('id'),'name':art.get('name'),'size_in_bytes':art.get('size_in_bytes'),'digest':art.get('digest'),
            },
            'verification_bundle':{
              'name':Path(bundle).name,'sha256':sha(bundle),'size_in_bytes':Path(bundle).stat().st_size,
            },
            'published_assets_before_full_bundle':sorted([{'name':x.get('name'),'digest':x.get('digest'),'size':x.get('size')} for x in rel.get('assets',[])], key=lambda x:x['name']),
            'claim_boundary':'Repository-scoped alpha prerelease closure only. No claim of AGI, universal correctness, universal semantic precision, universal hostile-code isolation, cross-environment reproducibility, or production performance/SLO superiority.',
          }
          unsigned=dict(summary)
          summary['report_sha256']=hashlib.sha256(json.dumps(unsigned, sort_keys=True, separators=(',',':')).encode()).hexdigest()
          Path('output/release-closure-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print('bundle', summary['verification_bundle'])
          print('summary report', summary['report_sha256'])
          PY
          cp output/nolane-habitat-0.1.0-alpha.20-verification-bundle.zip current-assets/
          cp output/release-closure-summary.json current-assets/
          python - <<'PY'
          import hashlib
          from pathlib import Path
          rows=[]
          for p in sorted(Path('current-assets').iterdir(), key=lambda x:x.name):
              if not p.is_file() or p.name == 'SHA256SUMS.txt': continue
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append(f'{h}  {p.name}')
          Path('output/SHA256SUMS.txt').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          print('checksum entries', len(rows))
          PY

      - name: Upload complete release assets and enrich notes
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            output/nolane-habitat-0.1.0-alpha.20-verification-bundle.zip \
            output/release-closure-summary.json \
            output/SHA256SUMS.txt
          python - <<'PY'
          import json
          rel=json.load(open('/tmp/release.json', encoding='utf-8'))
          body=rel.get('body') or ''
          marker='## Complete verification surface'
          if marker not in body:
              body=body.rstrip()+f'''\n\n{marker}\n\nThe prerelease is self-contained for audit and reproduction of repository-scoped verification evidence:\n\n- `nolane-habitat-0.1.0-alpha.20-verification-bundle.zip` — complete post-merge Ubuntu/Python 3.14 verification artifact plus CI/CodeQL authority metadata and release admission records.\n- `release-closure-summary.json` — machine-readable exact-commit closure summary for CI, CodeQL, Foundation Convergence 12/12, and alpha admission.\n- `SHA256SUMS.txt` — SHA-256 index for every published release asset except the checksum file itself.\n'''
          open('/tmp/release-notes.md','w',encoding='utf-8').write(body.rstrip()+'\n')
          PY
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.md

      - name: Verify final full release surface
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /tmp/final-release.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          rel=json.load(open('/tmp/final-release.json', encoding='utf-8'))
          assets={x.get('name'):x for x in rel.get('assets', [])}
          required={
            'nolane-habitat-0.1.0-alpha.20-verification-bundle.zip',
            'release-closure-summary.json','SHA256SUMS.txt','foundation-convergence-closure.json',
            'nolane_habitat-0.1.0a20-py3-none-any.whl','nolane_habitat-0.1.0a20.tar.gz',
            'release-manifest.json','promotion-verdict.json','maintainer-authorization.json',
          }
          missing=required-set(assets)
          if missing:
              raise SystemExit(f'missing final release assets: {sorted(missing)}')
          local={
            'nolane-habitat-0.1.0-alpha.20-verification-bundle.zip':Path('output/nolane-habitat-0.1.0-alpha.20-verification-bundle.zip'),
            'release-closure-summary.json':Path('output/release-closure-summary.json'),
            'SHA256SUMS.txt':Path('output/SHA256SUMS.txt'),
          }
          mismatches={}
          for name,p in local.items():
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              remote=(assets[name].get('digest') or '').removeprefix('sha256:')
              if remote != digest: mismatches[name]=(digest,remote)
          checks={
            'target':rel.get('target_commitish') == os.environ['TARGET_COMMIT'],
            'prerelease':rel.get('prerelease') is True,
            'draft':rel.get('draft') is False,
            'digests':not mismatches,
            'notes':'## Complete verification surface' in (rel.get('body') or ''),
          }
          if not all(checks.values()):
              raise SystemExit(f'final full release verification failed: {checks} mismatches={mismatches}')
          print('FINAL FULL RELEASE VERIFIED', {'asset_count':len(assets), **checks})
          PY
