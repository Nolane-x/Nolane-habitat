[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nolane-habitat"
version = "0.1.0a20"
description = "Agent-native project cognition workspace research prototype"
requires-python = ">=3.10"
authors = [{name = "Nolane"}]
license = "LicenseRef-Proprietary"
dependencies = ["pathspec>=0.12,<1", "tomli>=2.0.1; python_version < '3.11'"]

[project.optional-dependencies]
ui = ["playwright>=1.50", "websocket-client>=1.8,<2"]
python-semantic = ["jedi>=0.19,<1"]
tree-sitter = ["tree-sitter>=0.26,<0.27", "tree-sitter-language-pack>=1.12.3,<2"]
mcp = ["mcp>=2,<3"]
dev = ["build>=1.2,<2", "jsonschema>=4", "jedi>=0.19,<1", "pytest>=8"]

[project.scripts]
habitat = "habitat.cli:main"
habitat-agent-server = "habitat.server:main"
habitat-mcp-server = "habitat.mcp_adapter:main"
habitat-observatory = "habitat.observatory:main"

[tool.setuptools.packages.find]
include = ["habitat*"]

[tool.setuptools.package-data]
habitat = ["observatory_assets/*"]
